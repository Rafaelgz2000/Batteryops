<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BatteryOps · Robotics Team</title>
<style>
:root{--bg:#0b1220;--panel:#121c2d;--panel2:#172337;--line:#26354b;--text:#e9f0fa;--muted:#9aabc2;--green:#36d399;--yellow:#fbbf24;--orange:#fb923c;--red:#fb7185;--blue:#60a5fa;--purple:#c4b5fd;--shadow:0 12px 32px #0002}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#213049;color:var(--text);border-radius:10px;padding:9px 12px;font-weight:650}button:hover{filter:brightness(1.12)}button.primary{background:#2563eb;border-color:#3b82f6}button.good{background:#0e5f4a;border-color:#16785f}button.warn{background:#70451a;border-color:#9a6424}button.danger{background:#642b3b;border-color:#8c3b51}button.ghost{background:transparent}button.small{padding:5px 8px;font-size:12px}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);background:#0e1727;padding:22px 14px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#22c55e);display:grid;place-items:center;font-size:20px}.brand strong{display:block;font-size:16px;letter-spacing:.2px}.brand small{color:var(--muted)}.navlabel{font-size:10px;color:#7487a2;text-transform:uppercase;letter-spacing:1.3px;padding:0 10px;margin:6px 0}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border-color:transparent;color:#aebdd0;font-weight:550;padding:11px 12px}.nav button.active{background:#1b2a42;color:white;border-color:#30435f}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:12px}.main{min-width:0}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line);background:#0b1220dd;position:sticky;top:0;z-index:4;backdrop-filter:blur(12px)}.crumb{color:var(--muted);font-size:12px}.topbar h1{margin:2px 0 0;font-size:20px}.topright{display:flex;align-items:center;gap:10px}.teamtag{border:1px solid var(--line);border-radius:20px;padding:7px 11px;color:#b9c7d9;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#243956;color:#bfdbfe;font-weight:800}.content{padding:28px 30px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.welcome h2{font-size:24px;margin:0 0 4px}.welcome p{color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:17px;position:relative;overflow:hidden}.stathead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.staticon{font-size:18px}.statnum{font-size:29px;font-weight:800;margin:9px 0 2px;letter-spacing:-.8px}.statfoot{font-size:11px;color:var(--muted)}.stat:after{content:"";position:absolute;bottom:0;left:0;height:3px;width:100%;background:var(--accent,#60a5fa);opacity:.8}.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:16px;margin-bottom:16px}.panel{padding:18px;min-width:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panelhead h3{font-size:15px;margin:0}.sub{font-size:12px;color:var(--muted)}.batterylist{display:grid;gap:10px}.batteryrow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid #26364c;background:#111b2b;border-radius:12px;padding:12px}.baticon{width:42px;height:42px;display:grid;place-items:center;background:#202f45;border-radius:11px;font-size:20px}.batname{font-weight:750}.batmeta{font-size:11px;color:var(--muted);margin-top:3px}.progress{height:6px;background:#27364a;border-radius:10px;overflow:hidden;margin-top:9px;max-width:350px}.progress span{display:block;height:100%;border-radius:10px;background:var(--green)}.charge{font-size:18px;font-weight:800;text-align:right}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.25px;background:#22334a;color:#cbd5e1;white-space:nowrap}.badge.green{background:#123b34;color:#65e6bd}.badge.yellow{background:#493a17;color:#fbd36c}.badge.orange{background:#4d2f1a;color:#fdba74}.badge.red{background:#4b2532;color:#fda4af}.badge.purple{background:#352a50;color:#d8b4fe}.badge.gray{background:#273447;color:#b7c4d5}.minirow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.minirow:last-child{border-bottom:0}.minirow strong{font-size:13px}.minirow small{display:block;color:var(--muted);margin-top:3px}.alert{border:1px solid #6b3c38;background:#321f2a;border-radius:12px;padding:13px;display:flex;gap:10px;margin-bottom:10px}.alert:last-child{margin:0}.alerticon{font-size:18px}.alert strong{display:block;font-size:12px}.alert small{color:#d8a7b1}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}th{background:#172337;color:#9eafc6;text-transform:uppercase;letter-spacing:.65px;font-size:10px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#ffffff04}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search,input,select,textarea{background:#0e1727;border:1px solid #30415a;border-radius:9px;color:var(--text);padding:10px 11px;outline:none;max-width:100%}.search{min-width:200px}input:focus,select:focus,textarea:focus{border-color:#60a5fa}.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.empty{text-align:center;padding:30px;color:var(--muted)}.pageintro{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}.pageintro h2{margin:0 0 5px;font-size:23px}.pageintro p{margin:0;color:var(--muted)}.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{color:#b9c7d9;font-size:12px;font-weight:650}.field.full{grid-column:1/-1}.field textarea{min-height:100px;resize:vertical}.modalback{position:fixed;inset:0;background:#030712b8;display:grid;place-items:center;padding:16px;z-index:20}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#121c2d;border:1px solid #34445c;border-radius:17px;padding:22px;box-shadow:0 25px 80px #0008}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0;font-size:18px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:18px;bottom:18px;background:#173c32;border:1px solid #287a5d;color:#c7f9e8;border-radius:12px;padding:12px 16px;z-index:50;box-shadow:var(--shadow)}.mobilemenu{display:none}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tabs button{font-size:12px}.tabs button.active{background:#1d4ed8;border-color:#3b82f6}.note{background:#172337;border:1px solid var(--line);padding:12px;border-radius:10px;color:var(--muted);font-size:12px}.settingsrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}.settingsrow:last-child{border-bottom:0}.settingsrow strong{display:block}.settingsrow small{color:var(--muted)}.hidden{display:none!important}
@media(max-width:1050px){.app{grid-template-columns:210px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.content{padding:22px}.topbar{padding:0 22px}}
@media(max-width:700px){.app{display:block}.sidebar{display:none;position:fixed;top:0;bottom:0;left:0;width:260px;z-index:30;box-shadow:0 0 0 100vmax #0009}.sidebar.open{display:flex}.topbar{height:66px;padding:0 15px}.topbar h1{font-size:17px}.crumb,.teamtag{display:none}.mobilemenu{display:inline-flex}.content{padding:19px 14px 90px}.welcome,.pageintro{display:block}.welcome h2,.pageintro h2{font-size:21px}.welcome .actions,.pageintro .actions{margin-top:14px}.stats{gap:9px}.stat{padding:13px}.statnum{font-size:25px}.stathead{font-size:11px}.cards3{grid-template-columns:repeat(2,minmax(0,1fr))}.batteryrow{grid-template-columns:38px minmax(0,1fr) auto;padding:10px;gap:9px}.baticon{width:38px;height:38px}.charge{font-size:15px}.badge{font-size:9px;padding:4px 6px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.search{min-width:0;flex:1}.navlabel{margin-top:2px}.sidefoot{margin-bottom:15px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">ϟ</div><div><strong>BatteryOps</strong><small>Robotics team tools</small></div></div>
 <div><div class="navlabel">Workspace</div><nav class="nav" id="nav">
 <button data-page="dashboard" class="active"><span class="ico">▦</span>Dashboard</button>
 <button data-page="inventory"><span class="ico">▣</span>Battery inventory</button>
 <button data-page="charge"><span class="ico">ϟ</span>Charge sheet</button>
 <button data-page="matches"><span class="ico">⚑</span>Match assignments</button>
 <button data-page="history"><span class="ico">◷</span>Battery history</button>
 <button data-page="tools"><span class="ico">⌁</span>Tool loan sheet</button>
 <button data-page="robot"><span class="ico">⚙</span>Robot information</button>
 </nav></div>
 <div><div class="navlabel">Manage</div><nav class="nav"><button data-page="settings"><span class="ico">☷</span>Settings & backup</button></nav></div>
 <div class="sidefoot"><strong style="color:#dce8f7">Team workspace</strong><br><span>Prototype · saved on this device</span><br><br><span>Charge levels are estimates, not live battery telemetry.</span></div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobilemenu ghost" id="menuBtn">☰</button><div><div class="crumb">WORKSPACE / <span id="crumb">DASHBOARD</span></div><h1 id="topTitle">Dashboard</h1></div></div><div class="topright"><span class="teamtag">⚡ Robotics · Battery control</span><div class="avatar">R</div></div></header>
<div class="content" id="content"></div>
</main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='batteryops-prototype-v1';
const now=()=>Date.now(), iso=(t=now())=>new Date(t).toISOString(), fmt=t=>t?new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—', dur=ms=>{if(ms<0)ms=0;let m=Math.floor(ms/60000);return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`};
const demo=()=>({settings:{chargeMinutes:65,lowThreshold:30,fullThreshold:90,teamName:'Robotics Team'},batteries:[
{id:'BAT-01',category:'Competition',model:'12V robot battery',charge:100,state:'available',lastKnown:100,updatedAt:now()-3600000,notes:'Primary match battery',history:[]},
{id:'BAT-02',category:'Competition',model:'12V robot battery',charge:78,state:'available',lastKnown:78,updatedAt:now()-9000000,notes:'',history:[]},
{id:'BAT-03',category:'Competition',model:'12V robot battery',charge:42,state:'available',lastKnown:42,updatedAt:now()-18000000,notes:'',history:[]},
{id:'BAT-04',category:'Practice',model:'12V robot battery',charge:18,state:'available',lastKnown:18,updatedAt:now()-30000000,notes:'',history:[]},
{id:'BAT-05',category:'Practice',model:'12V robot battery',charge:64,state:'charging',lastKnown:64,chargeStart:now()-1800000,chargeStartPct:64,updatedAt:now()-1800000,notes:'',history:[]},
{id:'BAT-06',category:'Competition',model:'12V robot battery',charge:92,state:'inRobot',robot:'Competition robot',robotStart:now()-1200000,lastKnown:92,updatedAt:now()-1200000,notes:'',history:[]},
{id:'BAT-07',category:'Practice',model:'12V robot battery',charge:85,state:'available',lastKnown:85,updatedAt:now()-5000000,notes:'',history:[]},
{id:'BAT-08',category:'Practice',model:'12V robot battery',charge:0,state:'bad',lastKnown:0,updatedAt:now()-86400000,flagReason:'Dropped',flaggedAt:now()-86400000,notes:'Inspect before reuse',history:[]}
],matches:[{id:1,kind:'Competition',event:'Regional Event',match:'Q-12',time:now()+3600000,battery:'BAT-01',status:'Upcoming',notes:''},{id:2,kind:'Competition',event:'Regional Event',match:'Q-13',time:now()+7200000,battery:'BAT-02',status:'Upcoming',notes:''},{id:3,kind:'Practice',event:'Tuesday Practice',match:'Practice 4',time:now()+86400000,battery:'BAT-07',status:'Upcoming',notes:''}],tools:[{id:1,name:'1/2" socket wrench',toolId:'TL-01',team:'Drive Team',qty:1,checkedOut:now()-7200000,expected:now()-1800000,returned:false,notes:''},{id:2,name:'Battery voltage checker',toolId:'TL-02',team:'Electrical',qty:1,checkedOut:now()-3600000,expected:now()+3600000,returned:false,notes:''},{id:3,name:'Hex key set',toolId:'TL-03',team:'Mechanical',qty:1,checkedOut:now()-86400000,expected:now()-80000000,returned:true,returnedAt:now()-82000000,notes:''}],robotNotes:[],history:[],nextMatch:4,nextTool:4});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||demo()}catch{db=demo()}
let page='dashboard', filter='All', searchText='', toastTimer;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function estimate(b){if(b.state==='charging'&&b.chargeStart){let mins=(now()-b.chargeStart)/60000, cap=db.settings.chargeMinutes||65;return Math.min(100,Math.round((Number(b.chargeStartPct)||0)+(100-(Number(b.chargeStartPct)||0))*mins/cap))}return Number(b.charge)||0}
function chargeLabel(b){let c=estimate(b);if(b.state==='bad')return ['Bad battery','red'];if(b.state==='retired')return ['Retired','gray'];if(b.state==='charging')return [c>db.settings.fullThreshold?'Charged · charging':'Charging','yellow'];if(b.state==='inRobot')return ['In robot','purple'];if(c<db.settings.lowThreshold)return ['Critical','red'];if(c>db.settings.fullThreshold)return ['Charged','green'];return ['Partial charge','orange']}
function usable(b){return !['bad','retired','charging','inRobot'].includes(b.state)&&estimate(b)>=db.settings.lowThreshold}
function badge(b){let [t,c]=chargeLabel(b);return `<span class="badge ${c}">${t}</span>`}
function pctbar(b){let c=estimate(b), color=c<30?'var(--red)':c<60?'var(--orange)':c<=90?'var(--yellow)':'var(--green)';return `<div class="progress"><span style="width:${c}%;background:${color}"></span></div>`}
function batteryName(id){let b=db.batteries.find(x=>x.id===id);return b?b.id:'Unassigned'}
function stats(){let bs=db.batteries.filter(b=>b.state!=='retired');return {total:bs.length,charging:bs.filter(b=>b.state==='charging').length,charged:bs.filter(b=>estimate(b)>db.settings.fullThreshold&&b.state!=='bad'&&b.state!=='retired').length,low:bs.filter(b=>estimate(b)<db.settings.lowThreshold&&b.state!=='bad').length,bad:bs.filter(b=>b.state==='bad').length,robot:bs.filter(b=>b.state==='inRobot').length,available:bs.filter(usable).length}}
function stat(title,num,foot,icon,color){return `<div class="stat" style="--accent:${color}"><div class="stathead">${title}<span class="staticon">${icon}</span></div><div class="statnum">${num}</div><div class="statfoot">${foot}</div></div>`}
function head(title,desc,actions=''){return `<div class="pageintro"><div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function table(headers,rows,empty='No records yet.'){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${empty}</div>`}
function options(arr,selected){return arr.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function actionButtons(b){return `<div class="tools"><button class="small" onclick="editBattery('${esc(b.id)}')">Edit</button>${b.state==='charging'?`<button class="small good" onclick="removeCharger('${esc(b.id)}')">Stop charge</button>`:`<button class="small" onclick="startCharge('${esc(b.id)}')">Charge</button>`}${b.state==='inRobot'?`<button class="small warn" onclick="removeRobot('${esc(b.id)}')">Remove robot</button>`:`<button class="small" onclick="putRobot('${esc(b.id)}')">Put in robot</button>`}${b.state!=='bad'&&b.state!=='retired'?`<button class="small danger" onclick="flagBattery('${esc(b.id)}')">Flag</button>`:b.state==='bad'?`<button class="small good" onclick="inspectBattery('${esc(b.id)}')">Inspect</button>`:''}</div>`}
function batteryTable(bs){return table(['Battery','Category','Est. charge','Status','Last updated','Actions'],bs.map(b=>`<tr><td><strong>${esc(b.id)}</strong><div class="sub">${esc(b.model||'')}</div></td><td>${esc(b.category)}</td><td><strong>${estimate(b)}%</strong>${pctbar(b)}</td><td>${badge(b)}</td><td>${fmt(b.updatedAt)}</td><td>${actionButtons(b)}</td></tr>`))}
function dashboard(){let s=stats(), alerts=db.batteries.filter(b=>b.state==='bad'||(estimate(b)<db.settings.lowThreshold&&b.state!=='retired'));let active=db.batteries.filter(b=>b.state!=='retired').sort((a,b)=>estimate(b)-estimate(a)).slice(0,5);return `<div class="welcome"><div><h2>Good afternoon, team 👋</h2><p>Here's your battery and equipment status at a glance.</p></div><div class="actions"><button onclick="exportCSV('batteries')">↧ Export data</button><button class="primary" onclick="openBatteryModal()">＋ Add battery</button></div></div><div class="stats">${stat('Total batteries',s.total,'In active inventory','▣','#60a5fa')}${stat('Charging now',s.charging,'On a charger','ϟ','#fbbf24')}${stat('Charged & ready',s.charged,'Above charge threshold','✓','#36d399')}${stat('Available for use',s.available,'Ready, inspected & not assigned','◉','#60a5fa')}${stat('Low charge',s.low,'Below configured threshold','↘','#fb923c')}${stat('In robot',s.robot,'Currently deployed','⚙','#c4b5fd')}${stat('Flagged batteries',s.bad,'Inspection required','⚠','#fb7185')}${stat('Open tool loans',db.tools.filter(t=>!t.returned).length,'Tools not yet returned','⌁','#fbbf24')}</div><div class="grid2"><section class="panel"><div class="panelhead"><div><h3>Battery overview</h3><div class="sub">Live estimates · updates while this page is open</div></div><button class="small" onclick="navigate('charge')">View charge sheet →</button></div><div class="batterylist">${active.map(b=>`<div class="batteryrow"><div class="baticon">${b.state==='charging'?'ϟ':b.state==='inRobot'?'⚙':'▣'}</div><div><div class="batname">${esc(b.id)} <span style="margin-left:5px">${badge(b)}</span></div><div class="batmeta">${esc(b.category)} · ${b.state==='charging'?'Charging for '+dur(now()-b.chargeStart):b.state==='inRobot'?'In robot for '+dur(now()-b.robotStart):'Updated '+fmt(b.updatedAt)}</div>${pctbar(b)}</div><div class="charge">${estimate(b)}<span style="font-size:11px;color:var(--muted)">%</span></div></div>`).join('')}</div></section><section class="panel"><div class="panelhead"><div><h3>Needs attention</h3><div class="sub">Resolve these before the next match</div></div><span class="badge red">${alerts.length} alerts</span></div>${alerts.length?alerts.map(b=>`<div class="alert"><span class="alerticon">${b.state==='bad'?'⚠':'↘'}</span><div><strong>${esc(b.id)} · ${b.state==='bad'?'Inspection required':'Low estimated charge ('+estimate(b)+'%)'}</strong><small>${b.state==='bad'?esc(b.flagReason||'Flagged battery'):'Charge before use if appropriate'}</small><div style="margin-top:8px">${b.state==='bad'?`<button class="small good" onclick="inspectBattery('${esc(b.id)}')">Review battery</button>`:`<button class="small" onclick="startCharge('${esc(b.id)}')">Start charging</button>`}</div></div></div>`).join(''):`<div class="empty">✓ No urgent battery alerts</div>`}<div class="minirow"><div><strong>Upcoming matches</strong><small>${db.matches.filter(m=>m.status==='Upcoming').length} scheduled assignments</small></div><button class="small" onclick="navigate('matches')">Open →</button></div><div class="minirow"><div><strong>Tool checkout</strong><small>${db.tools.filter(t=>!t.returned).length} tools currently loaned</small></div><button class="small" onclick="navigate('tools')">Open →</button></div></section></div><section class="panel"><div class="panelhead"><div><h3>Upcoming battery assignments</h3><div class="sub">Scheduled practice and competition use</div></div><button class="small" onclick="navigate('matches')">Manage matches →</button></div>${matchTable(db.matches.filter(m=>m.status==='Upcoming').slice().sort((a,b)=>a.time-b.time))}</section>`}
function inventory(){let bs=db.batteries.filter(b=>b.state!=='retired');if(searchText)bs=bs.filter(b=>(b.id+' '+b.category+' '+b.model+' '+b.state).toLowerCase().includes(searchText.toLowerCase()));if(filter!=='All')bs=bs.filter(b=>filter==='Bad'?b.state==='bad':filter==='Charging'?b.state==='charging':filter==='In robot'?b.state==='inRobot':b.category===filter);return `${head('Battery inventory','Manage battery IDs, categories, condition, and availability.',`<button onclick="exportCSV('batteries')">↧ Export CSV</button><button class="primary" onclick="openBatteryModal()">＋ Add battery</button>`)}<section class="panel"><div class="filters"><input class="search" placeholder="Search ID, model, status…" value="${esc(searchText)}" oninput="searchText=this.value;render()"><select onchange="filter=this.value;render()">${options(['All','Practice','Competition','Charging','In robot','Bad'],filter)}</select><span class="sub">${bs.length} batteries</span></div>${batteryTable(bs)}</section>`}
function charge(){let bs=db.batteries.filter(b=>b.state!=='retired').sort((a,b)=>Number(b.state==='charging')-Number(a.state==='charging')||estimate(b)-estimate(a));return `${head('Battery charge sheet','Estimated charge and charger time. Percentages are not measured telemetry.',`<button onclick="exportCSV('batteries')">↧ Export CSV</button>`)}<div class="note" style="margin-bottom:16px">⚡ Full-charge estimate: <strong>${db.settings.chargeMinutes} minutes</strong> from 0% baseline. Charging estimates use elapsed time; battery-specific behavior can differ. Never use this estimate as a safety measurement.</div><section class="panel"><div class="panelhead"><h3>All active batteries</h3><span class="sub">Status recalculates from saved timestamps</span></div>${batteryTable(bs)}</section>`}
function matchTable(ms){return table(['Match','Type / event','Scheduled','Assigned battery','Battery status','Match status','Actions'],ms.map(m=>{let b=db.batteries.find(x=>x.id===m.battery);return `<tr><td><strong>${esc(m.match)}</strong></td><td>${esc(m.kind)}<div class="sub">${esc(m.event)}</div></td><td>${fmt(m.time)}</td><td>${esc(m.battery||'—')}</td><td>${b?badge(b):'<span class="badge gray">Unassigned</span>'}${b&&!usable(b)?'<div class="sub" style="color:var(--red)">Check availability</div>':''}</td><td><span class="badge ${m.status==='Completed'?'green':'gray'}">${esc(m.status)}</span></td><td><div class="tools"><button class="small" onclick="editMatch(${m.id})">Edit</button>${m.status==='Upcoming'?`<button class="small good" onclick="completeMatch(${m.id})">Complete</button>`:''}<button class="small danger" onclick="deleteMatch(${m.id})">Delete</button></div></td></tr>`}))}
function matches(){let ms=db.matches;if(filter!=='All')ms=ms.filter(m=>m.kind===filter||m.status===filter);if(searchText)ms=ms.filter(m=>(m.match+' '+m.event+' '+m.battery).toLowerCase().includes(searchText.toLowerCase()));return `${head('Match assignments','Plan battery usage for practice sessions and competition matches.',`<button class="primary" onclick="openMatchModal()">＋ Add match</button>`)}<section class="panel"><div class="filters"><input class="search" placeholder="Search match, event, battery…" value="${esc(searchText)}" oninput="searchText=this.value;render()"><select onchange="filter=this.value;render()">${options(['All','Practice','Competition','Upcoming','Completed'],filter)}</select></div>${matchTable(ms.slice().sort((a,b)=>a.time-b.time))}</section>`}
function historyPage(){let records=[...db.history];db.batteries.forEach(b=>(b.history||[]).forEach(h=>records.push({...h,battery:b.id})));records.sort((a,b)=>(b.time||0)-(a.time||0));if(searchText)records=records.filter(h=>(h.battery+' '+h.action+' '+h.detail).toLowerCase().includes(searchText.toLowerCase()));return `${head('Past battery orders','Audit trail of charging, robot usage, and battery incidents.',`<button onclick="exportCSV('history')">↧ Export history</button>`)}<div class="grid2"><section class="panel"><div class="panelhead"><h3>Suggested next battery order</h3><span class="badge green">Recommendation</span></div><div class="sub" style="margin-bottom:12px">Prioritizes charged, available, non-flagged batteries. Confirm battery condition before use.</div>${db.batteries.filter(usable).sort((a,b)=>estimate(b)-estimate(a)).slice(0,5).map((b,i)=>`<div class="minirow"><div><strong>${i+1}. ${esc(b.id)}</strong><small>${esc(b.category)} · ${estimate(b)}% estimated</small></div>${badge(b)}</div>`).join('')||'<div class="empty">No batteries currently ready</div>'}</section><section class="panel"><div class="panelhead"><h3>Recent activity</h3></div>${records.slice(0,6).map(h=>`<div class="minirow"><div><strong>${esc(h.action||'Activity')} · ${esc(h.battery||'')}</strong><small>${esc(h.detail||'')} · ${fmt(h.time)}</small></div></div>`).join('')||'<div class="empty">No battery activity recorded yet.</div>'}</section></div><section class="panel"><div class="panelhead"><h3>Full history</h3><input class="search" placeholder="Search history…" value="${esc(searchText)}" oninput="searchText=this.value;render()"></div>${table(['Time','Battery','Action','Details'],records.map(h=>`<tr><td>${fmt(h.time)}</td><td><strong>${esc(h.battery||'—')}</strong></td><td>${esc(h.action||'—')}</td><td>${esc(h.detail||'—')}</td></tr>`),'No history records yet.')}</section>`}
function toolsPage(){let ts=db.tools;if(searchText)ts=ts.filter(t=>(t.name+' '+t.toolId+' '+t.team).toLowerCase().includes(searchText.toLowerCase()));return `${head('Tool loan sheet','Check tools out to teams and track returns.',`<button onclick="exportCSV('tools')">↧ Export CSV</button><button class="primary" onclick="openToolModal()">＋ Add tool loan</button>`)}<div class="stats">${stat('Total loan records',db.tools.length,'Including returned tools','⌁','#60a5fa')}${stat('Currently loaned',db.tools.filter(t=>!t.returned).length,'Awaiting return','↗','#fbbf24')}${stat('Overdue',db.tools.filter(t=>!t.returned&&t.expected&&t.expected<now()).length,'Past expected return','⚠','#fb7185')}${stat('Returned',db.tools.filter(t=>t.returned).length,'Completed loans','✓','#36d399')}</div><section class="panel"><div class="filters"><input class="search" placeholder="Search tool or team…" value="${esc(searchText)}" oninput="searchText=this.value;render()"><span class="sub">Record who has each tool</span></div>${table(['Tool','Tool ID','Team / borrower','Qty','Checked out','Expected return','Status','Actions'],ts.slice().sort((a,b)=>Number(a.returned)-Number(b.returned)).map(t=>`<tr><td><strong>${esc(t.name)}</strong><div class="sub">${esc(t.notes||'')}</div></td><td>${esc(t.toolId||'—')}</td><td>${esc(t.team)}</td><td>${t.qty}</td><td>${fmt(t.checkedOut)}</td><td>${fmt(t.expected)}</td><td>${t.returned?'<span class="badge green">Returned</span>':t.expected&&t.expected<now()?'<span class="badge red">Overdue</span>':'<span class="badge yellow">Checked out</span>'}</td><td><div class="tools">${!t.returned?`<button class="small good" onclick="returnTool(${t.id})">Mark returned</button>`:''}<button class="small" onclick="editTool(${t.id})">Edit</button></div></td></tr>`),'No tool loans yet.')}</section>`}
function robotPage(){return `${head('Important robot information','Team-maintained notes, procedures, setup details, and troubleshooting.',`<button class="primary" onclick="openNoteModal()">＋ Add note</button>`)}<div class="note" style="margin-bottom:16px">Keep safety procedures and robot-specific details up to date. This page starts with your own notes—no team-specific information has been invented.</div><div class="cards3">${['Robot setup','Electrical system','Battery safety'].map((x,i)=>`<div class="stat" style="--accent:${['#60a5fa','#c4b5fd','#36d399'][i]}"><div class="stathead">QUICK CATEGORY <span class="staticon">${['⚙','ϟ','✓'][i]}</span></div><div style="font-weight:750;margin-top:10px">${x}</div><div class="statfoot">Add notes under this topic</div></div>`).join('')}</div><div class="grid2"><section class="panel"><div class="panelhead"><h3>Team notes</h3><span class="sub">${db.robotNotes.length} saved</span></div>${db.robotNotes.length?db.robotNotes.map(n=>`<div class="minirow" style="align-items:flex-start"><div style="min-width:0"><strong>${esc(n.title)}</strong><small>${esc(n.category)} · Updated ${fmt(n.updatedAt)}</small><div style="white-space:pre-wrap;color:#d5deeb;margin-top:10px">${esc(n.body)}</div></div><div class="tools"><button class="small" onclick="editNote(${n.id})">Edit</button><button class="small danger" onclick="deleteNote(${n.id})">Delete</button></div></div>`).join(''):'<div class="empty">No robot notes yet. Add the first note when your team is ready.</div>'}</section><section class="panel"><div class="panelhead"><h3>Battery quick actions</h3></div><div class="sub" style="margin-bottom:14px">Record battery movement as it happens.</div>${db.batteries.filter(b=>b.state!=='retired').map(b=>`<div class="minirow"><div><strong>${esc(b.id)}</strong><small>${estimate(b)}% estimated · ${chargeLabel(b)[0]}</small></div><div class="tools">${b.state==='inRobot'?`<button class="small warn" onclick="removeRobot('${esc(b.id)}')">Remove</button>`:`<button class="small" ${b.state==='bad'||b.state==='charging'?'disabled':''} onclick="putRobot('${esc(b.id)}')">Put in robot</button>`}${b.state==='charging'?`<button class="small good" onclick="removeCharger('${esc(b.id)}')">Stop charge</button>`:`<button class="small" ${b.state==='bad'||b.state==='inRobot'?'disabled':''} onclick="startCharge('${esc(b.id)}')">Charge</button>`}</div></div>`).join('')}</section></div>`}
function settingsPage(){return `${head('Settings & backup','Configure charge estimates and protect your team records.')}<div class="grid2"><section class="panel"><div class="panelhead"><h3>Charge estimation</h3><span class="badge yellow">Estimate only</span></div><div class="settingsrow"><div><strong>Full-charge duration</strong><small>Minutes to reach 100% from a 0% estimate</small></div><input id="chargeMinutes" type="number" min="1" max="300" value="${db.settings.chargeMinutes}" style="width:90px"></div><div class="settingsrow"><div><strong>Critical threshold</strong><small>Below this is considered critical</small></div><input id="lowThreshold" type="number" min="0" max="89" value="${db.settings.lowThreshold}" style="width:90px"></div><div class="settingsrow"><div><strong>Charged threshold</strong><small>Above this is considered charged</small></div><input id="fullThreshold" type="number" min="1" max="100" value="${db.settings.fullThreshold}" style="width:90px"></div><div style="margin-top:15px"><button class="primary" onclick="saveSettings()">Save settings</button></div></section><section class="panel"><div class="panelhead"><h3>Data & backup</h3></div><p class="sub">This prototype stores data in this browser on this device. It does not automatically sync with teammates or other devices.</p><div class="tools" style="margin:14px 0;flex-direction:column;align-items:stretch"><button onclick="exportJSON()">↧ Download full JSON backup</button><button onclick="exportCSV('batteries')">↧ Export batteries CSV</button><button onclick="exportCSV('matches')">↧ Export matches CSV</button><button onclick="exportCSV('tools')">↧ Export tools CSV</button><label class="note">Restore a JSON backup<input type="file" accept=".json,application/json" onchange="importJSON(event)" style="display:block;width:100%;margin-top:10px"></label><button class="danger" onclick="resetDemo()">Reset to demo data</button></div><div class="note">For shared use at competitions, connect this interface to a secure cloud database and authentication. Do not rely on one browser's local storage as the team's only record.</div></section></div>`}
function render(){let titles={dashboard:'Dashboard',inventory:'Battery inventory',charge:'Charge sheet',matches:'Match assignments',history:'Battery history',tools:'Tool loan sheet',robot:'Robot information',settings:'Settings & backup'};document.getElementById('topTitle').textContent=titles[page];document.getElementById('crumb').textContent=titles[page].toUpperCase();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={dashboard,inventory,charge,matches,history:historyPage,tools:toolsPage,robot:robotPage,settings:settingsPage};document.getElementById('content').innerHTML=views[page]();save()}
function navigate(p){page=p;filter='All';searchText='';document.getElementById('sidebar').classList.remove('open');render();window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
function toast(msg){let root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',2600)}
function log(b,action,detail=''){let rec={time:now(),battery:b.id,action,detail};db.history.push(rec);b.history=b.history||[];b.history.push(rec);b.updatedAt=now()}
function modal(title,body,onSave,saveText='Save'){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3>${title}</h3><button class="ghost" onclick="closeModal()">✕</button></div><form id="modalForm">${body}<div class="modalfoot"><button type="button" onclick="closeModal()">Cancel</button><button class="primary" type="submit">${saveText}</button></div></form></div></div>`;document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();if(onSave()!==false){closeModal();render()}}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function val(id){return document.getElementById(id)?.value?.trim()||''}
function openBatteryModal(id){let b=db.batteries.find(x=>x.id===id),editing=!!b;modal(editing?'Edit battery':'Add battery',`<div class="formgrid"><div class="field"><label>Battery ID *</label><input id="fId" required value="${esc(b?.id||'')}" ${editing?'readonly':''} placeholder="e.g. BAT-09"></div><div class="field"><label>Battery category *</label><select id="fCategory" required>${options(['Practice','Competition'],b?.category||'Practice')}</select></div><div class="field"><label>Battery model</label><input id="fModel" value="${esc(b?.model||'')}" placeholder="e.g. 12V battery"></div><div class="field"><label>Estimated charge (%)</label><input id="fCharge" type="number" min="0" max="100" value="${b?estimate(b):100}" required></div><div class="field full"><label>Notes</label><textarea id="fNotes">${esc(b?.notes||'')}</textarea></div></div>`,()=>{let id=val('fId').toUpperCase(),pct=Number(val('fCharge'));if(!id){toast('Battery ID is required');return false}if(!editing&&db.batteries.some(x=>x.id.toLowerCase()===id.toLowerCase())){toast('That battery ID already exists');return false}if(!Number.isFinite(pct)||pct<0||pct>100){toast('Charge must be between 0 and 100');return false}if(editing){b.category=val('fCategory');b.model=val('fModel');b.notes=val('fNotes');b.charge=pct;b.lastKnown=pct;b.updatedAt=now();log(b,'Battery edited','Inventory details updated')}else{let n={id,category:val('fCategory'),model:val('fModel'),charge:pct,lastKnown:pct,state:'available',updatedAt:now(),notes:val('fNotes'),history:[]};db.batteries.push(n);log(n,'Battery added',`${n.category} · ${pct}% initial estimate`)}toast(editing?'Battery updated':'Battery added');return true})}
function editBattery(id){openBatteryModal(id)}
function startCharge(id){let b=db.batteries.find(x=>x.id===id);if(!b||b.state==='bad'||b.state==='retired'||b.state==='inRobot'){toast('Cannot charge this battery in its current state');return}if(b.state==='charging'){toast('Already charging');return}b.lastKnown=estimate(b);b.charge=b.lastKnown;b.chargeStart=now();b.chargeStartPct=b.charge;b.state='charging';log(b,'Charging started',`Started at estimated ${b.chargeStartPct}%`);save();toast(`${id} placed on charger`);render()}
function removeCharger(id){let b=db.batteries.find(x=>x.id===id);if(!b||b.state!=='charging')return;let pct=estimate(b);b.charge=pct;b.lastKnown=pct;b.state='available';delete b.chargeStart;delete b.chargeStartPct;log(b,'Removed from charger',`Estimated charge ${pct}%`);save();toast(`${id} removed from charger · ${pct}% estimated`);render()}
function putRobot(id){let b=db.batteries.find(x=>x.id===id);if(!b)return;if(b.state==='bad'||b.state==='retired'||b.state==='charging'||b.state==='inRobot'||estimate(b)<db.settings.lowThreshold){toast('Battery unavailable: check charge and status');return}modal('Put battery in robot',`<div class="formgrid"><div class="field"><label>Battery</label><input value="${esc(id)}" disabled></div><div class="field"><label>Robot name</label><input id="robotName" value="Competition robot" required></div><div class="field full"><label>Match or session (optional)</label><input id="robotMatch" placeholder="e.g. Q-12 or Tuesday practice"></div></div>`,()=>{b.state='inRobot';b.robot=val('robotName');b.robotStart=now();b.sessionMatch=val('robotMatch');b.chargeBeforeUse=estimate(b);log(b,'Placed in robot',`${b.robot}${b.sessionMatch?' · '+b.sessionMatch:''} · ${b.chargeBeforeUse}% estimated before use`);toast(`${id} marked in robot`)})}
function removeRobot(id){let b=db.batteries.find(x=>x.id===id);if(!b||b.state!=='inRobot')return;let elapsed=now()-b.robotStart;modal('Remove battery from robot',`<p>Battery <strong>${esc(id)}</strong> has been in the robot for <strong>${dur(elapsed)}</strong>.</p><div class="field"><label>Estimated charge after use (%)</label><input id="afterCharge" type="number" min="0" max="100" value="${Math.max(0,estimate(b))}" required></div><div class="note" style="margin-top:12px">Set this estimate based on your team's chosen method or measurements. Time in the robot alone does not reveal true charge.</div>`,()=>{let pct=Number(val('afterCharge'));if(!Number.isFinite(pct)||pct<0||pct>100){toast('Enter a percentage from 0 to 100');return false}let before=b.chargeBeforeUse;b.charge=pct;b.lastKnown=pct;b.state='available';log(b,'Removed from robot',`${dur(elapsed)} used · estimated ${before}% → ${pct}%`);delete b.robotStart;delete b.robot;delete b.sessionMatch;delete b.chargeBeforeUse;toast(`${id} removed from robot`)})}
function flagBattery(id){let b=db.batteries.find(x=>x.id===id);if(!b)return;modal('Flag battery for inspection',`<div class="field"><label>Battery</label><input value="${esc(id)}" disabled></div><div class="field" style="margin-top:12px"><label>Reason *</label><select id="flagReason">${options(['Dropped','Damaged','Defective','Not holding charge','Other issue'],'Dropped')}</select></div><div class="field" style="margin-top:12px"><label>Additional details</label><textarea id="flagDetail" placeholder="Describe what happened…"></textarea></div>`,()=>{b.state='bad';b.flagReason=val('flagReason');b.flagDetail=val('flagDetail');b.flaggedAt=now();log(b,'Battery flagged',`${b.flagReason}${b.flagDetail?' · '+b.flagDetail:''}`);toast(`${id} flagged and unavailable`)},'Flag battery')}
function inspectBattery(id){let b=db.batteries.find(x=>x.id===id);if(!b||b.state!=='bad')return;modal('Inspection & return to service',`<div class="alert"><span class="alerticon">⚠</span><div><strong>${esc(id)} is flagged: ${esc(b.flagReason||'Issue')}</strong><small>This action should only be completed after a qualified team member inspects the battery and confirms it is safe to use.</small></div></div><div class="field"><label>Inspection notes *</label><textarea id="inspectNotes" required placeholder="Inspection result and who approved return…"></textarea></div>`,()=>{let note=val('inspectNotes');if(!note){toast('Inspection notes are required');return false}b.state='available';b.inspectedAt=now();b.inspectionNotes=note;delete b.flagReason;log(b,'Inspection passed',note);toast(`${id} marked available after inspection`)},'Confirm inspection')}
function openMatchModal(id){let m=db.matches.find(x=>x.id===id),editing=!!m;modal(editing?'Edit match assignment':'Add match assignment',`<div class="formgrid"><div class="field"><label>Match / session *</label><input id="mMatch" required value="${esc(m?.match||'')}" placeholder="e.g. Q-14"></div><div class="field"><label>Type *</label><select id="mKind">${options(['Practice','Competition'],m?.kind||'Competition')}</select></div><div class="field"><label>Event / practice name</label><input id="mEvent" value="${esc(m?.event||'')}" placeholder="Event name"></div><div class="field"><label>Scheduled time</label><input id="mTime" type="datetime-local" value="${m?new Date(m.time-new Date(m.time).getTimezoneOffset()*60000).toISOString().slice(0,16):new Date(now()+3600000-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div><div class="field"><label>Assign battery</label><select id="mBattery"><option value="">Unassigned</option>${db.batteries.filter(b=>b.state!=='retired').map(b=>`<option value="${esc(b.id)}" ${(m?.battery||'')===b.id?'selected':''}>${esc(b.id)} · ${estimate(b)}% · ${chargeLabel(b)[0]}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="mStatus">${options(['Upcoming','Completed'],m?.status||'Upcoming')}</select></div><div class="field full"><label>Notes</label><textarea id="mNotes">${esc(m?.notes||'')}</textarea></div></div>`,()=>{let battery=val('mBattery'),b=db.batteries.find(x=>x.id===battery),kind=val('mKind'),status=val('mStatus'),matchName=val('mMatch');if(!matchName){toast('Match name is required');return false}if(battery&&status==='Upcoming'&&b&&!usable(b)&&b.state!=='inRobot'){toast('Warning: this battery is not currently ready. Choose a usable battery or save it unassigned.');return false}if(battery&&status==='Upcoming'&&db.matches.some(x=>x.id!==(m?.id)&&x.battery===battery&&x.status==='Upcoming'&&Math.abs(x.time-new Date(val('mTime')).getTime())<2*3600000)){toast('Battery already assigned to a nearby upcoming match. Choose another battery.');return false}let obj={id:m?.id||db.nextMatch++,kind,event:val('mEvent'),match:matchName,time:new Date(val('mTime')).getTime()||now(),battery,status,notes:val('mNotes')};if(m)Object.assign(m,obj);else db.matches.push(obj);if(status==='Completed'&&battery&&b)log(b,'Match completed',`${matchName} · ${kind}`);toast(editing?'Match updated':'Match added')})}
function editMatch(id){openMatchModal(id)}
function completeMatch(id){let m=db.matches.find(x=>x.id===id);if(!m)return;m.status='Completed';let b=db.batteries.find(x=>x.id===m.battery);if(b)log(b,'Match completed',`${m.match} · ${m.kind}`);save();toast('Match marked completed');render()}
function deleteMatch(id){if(!confirm('Delete this match assignment?'))return;db.matches=db.matches.filter(m=>m.id!==id);save();render();toast('Match deleted')}
function openToolModal(id){let t=db.tools.find(x=>x.id===id),editing=!!t;modal(editing?'Edit tool loan':'Add tool loan',`<div class="formgrid"><div class="field"><label>Tool name *</label><input id="tName" required value="${esc(t?.name||'')}" placeholder="e.g. Hex key set"></div><div class="field"><label>Tool ID</label><input id="tId" value="${esc(t?.toolId||'')}" placeholder="e.g. TL-04"></div><div class="field"><label>Team / borrower *</label><input id="tTeam" required value="${esc(t?.team||'')}" placeholder="e.g. Electrical"></div><div class="field"><label>Quantity</label><input id="tQty" type="number" min="1" value="${t?.qty||1}"></div><div class="field"><label>Expected return</label><input id="tExpected" type="datetime-local" value="${t?.expected?new Date(t.expected-new Date(t.expected).getTimezoneOffset()*60000).toISOString().slice(0,16):''}"></div><div class="field"><label>Return status</label><select id="tReturned">${options(['No','Yes'],t?.returned?'Yes':'No')}</select></div><div class="field full"><label>Notes</label><textarea id="tNotes">${esc(t?.notes||'')}</textarea></div></div>`,()=>{let name=val('tName'),team=val('tTeam');if(!name||!team){toast('Tool name and borrower are required');return false}let returned=val('tReturned')==='Yes',obj={id:t?.id||db.nextTool++,name,toolId:val('tId'),team,qty:Math.max(1,Number(val('tQty'))||1),expected:val('tExpected')?new Date(val('tExpected')).getTime():null,returned,returnedAt:returned?(t?.returnedAt||now()):null,checkedOut:t?.checkedOut||now(),notes:val('tNotes')};if(t)Object.assign(t,obj);else db.tools.push(obj);toast(editing?'Tool loan updated':'Tool loan recorded')})}
function editTool(id){openToolModal(id)}
function returnTool(id){let t=db.tools.find(x=>x.id===id);if(!t)return;t.returned=true;t.returnedAt=now();save();toast(`${t.name} marked returned`);render()}
function openNoteModal(id){let n=db.robotNotes.find(x=>x.id===id);modal(n?'Edit robot note':'Add robot note',`<div class="formgrid"><div class="field full"><label>Title *</label><input id="nTitle" required value="${esc(n?.title||'')}" placeholder="e.g. Pre-match electrical checklist"></div><div class="field full"><label>Category</label><select id="nCategory">${options(['Robot setup','Electrical system','Battery safety','Match procedures','Troubleshooting','Other'],n?.category||'Robot setup')}</select></div><div class="field full"><label>Information *</label><textarea id="nBody" required style="min-height:180px" placeholder="Write your team's robot information here…">${esc(n?.body||'')}</textarea></div></div>`,()=>{if(!val('nTitle')||!val('nBody')){toast('Title and information are required');return false}if(n)Object.assign(n,{title:val('nTitle'),category:val('nCategory'),body:val('nBody'),updatedAt:now()});else db.robotNotes.push({id:now(),title:val('nTitle'),category:val('nCategory'),body:val('nBody'),updatedAt:now()});toast('Robot note saved')})}
function editNote(id){openNoteModal(id)}
function deleteNote(id){if(!confirm('Delete this robot note?'))return;db.robotNotes=db.robotNotes.filter(n=>n.id!==id);save();render();toast('Note deleted')}
function saveSettings(){let cm=Number(document.getElementById('chargeMinutes').value),lo=Number(document.getElementById('lowThreshold').value),hi=Number(document.getElementById('fullThreshold').value);if(cm<1||cm>300||lo<0||lo>=hi||hi>100){toast('Check settings: charge 1–300 min, low threshold below charged threshold');return}db.settings.chargeMinutes=cm;db.settings.lowThreshold=lo;db.settings.fullThreshold=hi;save();render();toast('Settings saved')}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function exportJSON(){download('batteryops-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');toast('Backup downloaded')}
function exportCSV(which){let rows;if(which==='batteries')rows=[['Battery ID','Category','Model','Estimated Charge %','State','Flag Reason','Last Updated','Notes'],...db.batteries.map(b=>[b.id,b.category,b.model,estimate(b),b.state,b.flagReason||'',fmt(b.updatedAt),b.notes||''])];else if(which==='matches')rows=[['Match','Type','Event','Scheduled','Battery','Status','Notes'],...db.matches.map(m=>[m.match,m.kind,m.event,fmt(m.time),m.battery,m.status,m.notes||''])];else if(which==='tools')rows=[['Tool','Tool ID','Team','Quantity','Checked Out','Expected Return','Returned','Notes'],...db.tools.map(t=>[t.name,t.toolId,t.team,t.qty,fmt(t.checkedOut),fmt(t.expected),t.returned?'Yes':'No',t.notes||''])];else rows=[['Time','Battery','Action','Details'],...db.history.map(h=>[fmt(h.time),h.battery,h.action,h.detail])];let csv=rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');download(`batteryops-${which}.csv`,csv,'text/csv;charset=utf-8');toast('CSV exported')}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.batteries||!x.settings||!x.matches||!x.tools)throw Error();if(confirm('Replace current app data with this backup?')){db=x;save();render();toast('Backup restored')}}catch{toast('That file is not a valid BatteryOps backup')}};r.readAsText(f)}
function resetDemo(){if(!confirm('Reset all local app data to the original demo dataset? Any changes will be lost.'))return;db=demo();save();render();toast('Demo data restored')}
render();setInterval(()=>{if(page==='dashboard'||page==='charge'||page==='inventory'||page==='robot')render()},30000);
</script>
</body>
